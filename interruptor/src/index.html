        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        button {
          font-size: 1.2rem;
          background-color: crimson;
          color: white;
          padding: 10px 20px;
          border: none;
          border-radius: 8px;
          cursor: pointer;

  <body>
    <h1> Interrupt Assistant</h1>
    <button onclick="stopAssistant()">Stop Talking</button>

    <script type="module">
      import { invoke } from '@tauri-apps/api/tauri';

      async function stopAssistant() {
        await window.__TAURI__.invoke("stop_assistant");
      }

      window.stopAssistant = stopAssistant; // Making button callable by making it global
    </script>
